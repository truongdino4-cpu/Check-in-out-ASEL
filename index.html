<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASEL & Crestron Event Check-in</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            bg: '#F3F6F9',    // Light grayish blue background
                            primary: '#005C9E', // Tech blue
                            cyan: '#00B4D8',    // Brighter cyan for light mode
                            text: '#1E293B',    // Slate 800 for main text
                            light: '#94A3B8'    // Slate 400 for secondary text
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F3F6F9;
            color: #1E293B;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; /* Prevent body scroll, handle in app */
        }
        
        /* Custom scrollbar for webkit - Light Theme */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        
        /* Liquid Glass Effect */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 4px 24px -2px rgba(0, 92, 158, 0.08);
        }

        .liquid-glass-input {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Background decoration for liquid effect */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const initialGuests = [
            { id: 1, category: 'CEO', company: 'Phan Anh Living', name: 'A Phan Anh', phone: '', registered: true, checkIn: null, checkOut: null, gift: false },
            { id: 2, category: 'CEO', company: 'Trường Thắng', name: 'A Thành', phone: '0989000268', registered: true, checkIn: null, checkOut: null, gift: false },
            { id: 3, category: 'CEO', company: 'Alis', name: 'Sơn Alis', phone: '0947141713', registered: true, checkIn: null, checkOut: null, gift: false },
            { id: 4, category: 'CEO', company: 'Alis', name: 'Đức Alis', phone: '0983446899', registered: true, checkIn: null, checkOut: null, gift: false },
            { id: 5, category: 'CEO', company: 'PoliConcept', name: 'Anh Hưng', phone: '0929668666', registered: true, checkIn: null, checkOut: null, gift: false },
            { id: 6, category: 'CEO', company: 'Maison Décor', name: 'A Pho', phone: '', registered: true, checkIn: null, checkOut: null, gift: false },
            { id: 7, category: 'CEO', company: 'Smarthome Nexus', name: 'Tùng Etron', phone: '0912979000', registered: true, checkIn: null, checkOut: null, gift: false },
            { id: 8, category: 'SALE MANAGER', company: 'CARA Lighting', name: 'Trang Anh', phone: '', registered: true, checkIn: null, checkOut: null, gift: false },
            { id: 9, category: 'SALE MANAGER', company: 'Long Khang', name: 'A Hoàng', phone: '0983203378', registered: true, checkIn: null, checkOut: null, gift: false },
            { id: 10, category: 'SALE MANAGER', company: 'Unios Lighting', name: 'E Khanh', phone: '0966391656', registered: true, checkIn: null, checkOut: null, gift: false },
            { id: 11, category: 'BEST SALE', company: 'Unios Lighting', name: 'E Ngọc', phone: '', registered: true, checkIn: null, checkOut: null, gift: false },
            { id: 12, category: 'BEST SALE', company: 'Đèn Cavani', name: 'Thảo Phương', phone: '0938030145', registered: true, checkIn: null, checkOut: null, gift: false },
        ];

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'success' ? 'bg-green-100 border-green-400 text-green-800' : 
                           (type === 'error' ? 'bg-red-100 border-red-400 text-red-800' : 'bg-blue-100 border-blue-400 text-blue-800');
            const iconColor = type === 'success' ? 'text-green-500' : (type === 'error' ? 'text-red-500' : 'text-blue-500');
            const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle');

            return (
                <div className="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 w-[90%] max-w-sm animate-fade-in-down shadow-xl rounded-lg">
                    <div className={`border px-4 py-3 rounded-lg flex items-center space-x-3 liquid-glass ${bgColor}`}>
                        <i className={`fas ${icon} text-xl ${iconColor}`}></i>
                        <span className="font-medium text-sm flex-1">{message}</span>
                        <button onClick={onClose} className="opacity-60 hover:opacity-100">
                            <i className="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            );
        };

        const AutocompleteInput = ({ label, icon, placeholder, value, onChange, onSelect, suggestions }) => {
            const [showSuggestions, setShowSuggestions] = useState(false);
            const wrapperRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
                        setShowSuggestions(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            return (
                <div className="relative mb-5" ref={wrapperRef}>
                    <label className="block text-xs font-bold text-brand-primary mb-1.5 uppercase tracking-wider">{label}</label>
                    <div className="relative shadow-sm rounded-xl">
                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i className={`fas ${icon} text-brand-light`}></i>
                        </div>
                        <input
                            type="text"
                            value={value}
                            onChange={(e) => {
                                onChange(e.target.value);
                                setShowSuggestions(true);
                            }}
                            onFocus={() => setShowSuggestions(true)}
                            className="w-full liquid-glass-input text-brand-text text-sm rounded-xl focus:ring-2 focus:ring-brand-cyan/50 focus:border-brand-cyan block pl-10 p-3.5 outline-none transition-all placeholder-slate-400 font-medium"
                            placeholder={placeholder}
                        />
                    </div>
                    {showSuggestions && value.length > 0 && suggestions.length > 0 && (
                        <div className="absolute z-50 w-full mt-2 liquid-glass rounded-xl shadow-xl max-h-48 overflow-y-auto border border-white/80">
                            {suggestions.map((guest, idx) => (
                                <div 
                                    key={idx} 
                                    className="p-3 hover:bg-blue-50 cursor-pointer border-b border-gray-100 last:border-0 text-sm transition-colors"
                                    onClick={() => {
                                        onSelect(guest);
                                        setShowSuggestions(false);
                                    }}
                                >
                                    <div className="font-bold text-brand-text">{guest.name}</div>
                                    <div className="text-xs text-brand-light">{guest.company}</div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [guests, setGuests] = useState(initialGuests);
            const [activeTab, setActiveTab] = useState('checkin'); // Default to checkin for quick action
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
            };

            const getExactTime = () => {
                const now = new Date();
                return now.toLocaleTimeString('vi-VN', { hour12: false });
            };

            const exportToCSV = () => {
                const headers = ["STT", "Hạng mục", "Công Ty", "Khách mời", "SĐT", "Loại khách", "Thời gian Check-in", "Thời gian Check-out", "Đã nhận quà"];
                const rows = guests.map((g, i) => [
                    i + 1,
                    g.category || "Khách ngoài",
                    `"${g.company}"`,
                    `"${g.name}"`,
                    g.phone || "",
                    g.registered ? "Đăng ký trước" : "Khách vãng lai",
                    g.checkIn || "Chưa",
                    g.checkOut || "Chưa",
                    g.gift ? "Có" : "Không"
                ]);

                let csvContent = "data:text/csv;charset=utf-8,\ufeff" 
                    + headers.join(",") + "\n" 
                    + rows.map(e => e.join(",")).join("\n");

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Checkin_Report_${new Date().getTime()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Đã xuất file Excel (CSV) thành công!");
            };

            const renderList = () => {
                const [searchTerm, setSearchTerm] = useState('');
                
                const filteredGuests = guests.filter(g => 
                    g.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    g.company.toLowerCase().includes(searchTerm.toLowerCase())
                );

                return (
                    <div className="flex flex-col h-full animate-fade-in relative z-10 pb-8">
                        <div className="sticky top-0 z-10 pb-3 pt-1">
                            <div className="relative shadow-sm rounded-xl">
                                <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                    <i className="fas fa-search text-brand-light"></i>
                                </div>
                                <input 
                                    type="text" 
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="liquid-glass w-full text-brand-text text-sm rounded-xl block pl-10 p-3 outline-none focus:ring-2 focus:ring-brand-cyan/50 placeholder-slate-400 font-medium"
                                    placeholder="Tìm tên khách hoặc công ty..."
                                />
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto space-y-2.5">
                            {filteredGuests.map(guest => (
                                <div key={guest.id} className="liquid-glass p-3 rounded-xl flex items-center justify-between relative overflow-hidden transition-all hover:shadow-md">
                                    {/* Left Status Bar */}
                                    <div className="absolute left-0 top-0 bottom-0 w-1 flex flex-col">
                                        <div className={`flex-1 ${guest.checkIn ? 'bg-green-400' : 'bg-gray-200'}`}></div>
                                        <div className={`flex-1 ${guest.checkOut ? 'bg-brand-primary' : 'bg-gray-200'}`}></div>
                                    </div>

                                    <div className="pl-2 flex-1 min-w-0">
                                        <div className="flex items-center space-x-2">
                                            <h3 className="font-bold text-[15px] text-brand-text truncate">{guest.name}</h3>
                                            {!guest.registered && (
                                                <span className="text-[9px] bg-orange-100 text-orange-600 px-1.5 py-0.5 rounded border border-orange-200 whitespace-nowrap">Mới</span>
                                            )}
                                        </div>
                                        <p className="text-[12px] text-brand-primary font-medium truncate">{guest.company}</p>
                                    </div>
                                    
                                    <div className="flex flex-col items-end pl-2 border-l border-gray-200/50 min-w-[75px]">
                                        <div className="flex items-center space-x-1 text-[10px] text-gray-500 font-medium">
                                            <i className="fas fa-sign-in-alt text-green-500 w-3"></i>
                                            <span>{guest.checkIn || '--:--'}</span>
                                        </div>
                                        <div className="flex items-center space-x-1 text-[10px] text-gray-500 font-medium mt-1">
                                            <i className="fas fa-sign-out-alt text-brand-cyan w-3"></i>
                                            <span>{guest.checkOut || '--:--'}</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {filteredGuests.length === 0 && (
                                <div className="text-center text-brand-light mt-10 font-medium">Không tìm thấy kết quả nào.</div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderCheckIn = () => {
                const [name, setName] = useState('');
                const [company, setCompany] = useState('');

                const suggestions = useMemo(() => {
                    const query = name.toLowerCase() || company.toLowerCase();
                    if (!query) return [];
                    return guests.filter(g => 
                        !g.checkIn && 
                        (g.name.toLowerCase().includes(query) || g.company.toLowerCase().includes(query))
                    );
                }, [name, company, guests]);

                const handleSelectSuggestion = (guest) => {
                    setName(guest.name);
                    setCompany(guest.company);
                };

                const handleSubmit = () => {
                    if (!name.trim() || !company.trim()) {
                        showToast("Vui lòng nhập đầy đủ Tên và Công ty", "error");
                        return;
                    }

                    const guestIndex = guests.findIndex(g => 
                        g.name.toLowerCase() === name.trim().toLowerCase() && 
                        g.company.toLowerCase() === company.trim().toLowerCase()
                    );

                    if (guestIndex >= 0) {
                        if (guests[guestIndex].checkIn) {
                            showToast("Khách này đã check-in trước đó!", "error");
                            return;
                        }
                        const newGuests = [...guests];
                        newGuests[guestIndex].checkIn = getExactTime();
                        setGuests(newGuests);
                        showToast(`Check-in thành công: ${guests[guestIndex].name}`, "success");
                    } else {
                        const newGuest = {
                            id: Date.now(),
                            category: 'KHÁCH NGOÀI',
                            company: company.trim(),
                            name: name.trim(),
                            phone: '',
                            registered: false,
                            checkIn: getExactTime(),
                            checkOut: null,
                            gift: false
                        };
                        setGuests([...guests, newGuest]);
                        showToast(`Đã thêm & Check-in khách mới: ${name}`, "success");
                    }
                    
                    setName('');
                    setCompany('');
                };

                return (
                    <div className="flex flex-col h-full animate-fade-in py-2 relative z-10">
                        <div className="liquid-glass p-6 rounded-2xl">
                            <div className="text-center mb-6">
                                <div className="inline-flex items-center justify-center w-14 h-14 rounded-full bg-blue-50 text-brand-primary mb-3 shadow-inner border border-white">
                                    <i className="fas fa-sign-in-alt text-2xl"></i>
                                </div>
                                <h2 className="text-xl font-extrabold text-brand-text">Xác nhận Check In</h2>
                                <p className="text-xs text-brand-light mt-1">Ghi nhận thời gian khách tới sự kiện</p>
                            </div>

                            <AutocompleteInput 
                                label="Tên khách mời" 
                                icon="fa-user" 
                                placeholder="Nhập hoặc chọn tên..." 
                                value={name} 
                                onChange={setName}
                                onSelect={handleSelectSuggestion}
                                suggestions={suggestions}
                            />
                            
                            <AutocompleteInput 
                                label="Tên công ty" 
                                icon="fa-building" 
                                placeholder="Nhập hoặc chọn công ty..." 
                                value={company} 
                                onChange={setCompany}
                                onSelect={handleSelectSuggestion}
                                suggestions={suggestions}
                            />

                            <button 
                                onClick={handleSubmit}
                                className="w-full mt-4 bg-brand-primary text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-brand-primary/30 transform transition hover:-translate-y-0.5 active:scale-95 focus:outline-none text-[15px]"
                            >
                                Ghi nhận Check In
                            </button>
                        </div>
                    </div>
                );
            };

            const renderCheckOut = () => {
                const [step, setStep] = useState(1);
                const [name, setName] = useState('');
                const [company, setCompany] = useState('');
                const [foundGuest, setFoundGuest] = useState(null);
                const [giftReceived, setGiftReceived] = useState(false);

                const suggestions = useMemo(() => {
                    const query = name.toLowerCase() || company.toLowerCase();
                    if (!query) return [];
                    return guests.filter(g => 
                        !g.checkOut && 
                        (g.name.toLowerCase().includes(query) || g.company.toLowerCase().includes(query))
                    );
                }, [name, company, guests]);

                const handleSelectSuggestion = (guest) => {
                    setName(guest.name);
                    setCompany(guest.company);
                };

                const handleSearch = () => {
                    if (!name.trim() || !company.trim()) {
                        showToast("Vui lòng nhập đầy đủ thông tin", "error");
                        return;
                    }
                    const guest = guests.find(g => 
                        g.name.toLowerCase() === name.trim().toLowerCase() && 
                        g.company.toLowerCase() === company.trim().toLowerCase()
                    );
                    setFoundGuest(guest || null);
                    setStep(2);
                    setGiftReceived(false);
                };

                const handleConfirmCheckOut = () => {
                    const time = getExactTime();
                    
                    if (foundGuest && foundGuest.registered) {
                        if (!giftReceived) {
                            showToast("Khách đăng ký trước bắt buộc phải nhận quà!", "error");
                            return;
                        }
                        const newGuests = guests.map(g => 
                            g.id === foundGuest.id ? { ...g, checkOut: time, gift: true } : g
                        );
                        setGuests(newGuests);
                        showToast(`Check-out thành công: ${foundGuest.name}`, "success");
                    } else if (foundGuest && !foundGuest.registered) {
                         const newGuests = guests.map(g => 
                            g.id === foundGuest.id ? { ...g, checkOut: time, gift: false } : g
                        );
                        setGuests(newGuests);
                        showToast(`Check-out thành công (Khách ngoài): ${foundGuest.name}`, "success");
                    } else {
                        const newGuest = {
                            id: Date.now(),
                            category: 'KHÁCH NGOÀI',
                            company: company.trim(),
                            name: name.trim(),
                            phone: '',
                            registered: false,
                            checkIn: null, 
                            checkOut: time,
                            gift: false
                        };
                        setGuests([...guests, newGuest]);
                        showToast(`Đã ghi nhận Check-out khách mới: ${name}`, "success");
                    }

                    setStep(1);
                    setName('');
                    setCompany('');
                    setFoundGuest(null);
                };

                if (step === 1) {
                    return (
                        <div className="flex flex-col h-full animate-fade-in py-2 relative z-10">
                            <div className="liquid-glass p-6 rounded-2xl">
                                <div className="text-center mb-6">
                                    <div className="inline-flex items-center justify-center w-14 h-14 rounded-full bg-cyan-50 text-brand-cyan mb-3 shadow-inner border border-white">
                                        <i className="fas fa-sign-out-alt text-2xl"></i>
                                    </div>
                                    <h2 className="text-xl font-extrabold text-brand-text">Tra cứu Check Out</h2>
                                    <p className="text-xs text-brand-light mt-1">Tìm khách để làm thủ tục ra về</p>
                                </div>

                                <AutocompleteInput 
                                    label="Tên khách mời" 
                                    icon="fa-user" 
                                    placeholder="Nhập tên..." 
                                    value={name} 
                                    onChange={setName}
                                    onSelect={handleSelectSuggestion}
                                    suggestions={suggestions}
                                />
                                
                                <AutocompleteInput 
                                    label="Tên công ty" 
                                    icon="fa-building" 
                                    placeholder="Nhập công ty..." 
                                    value={company} 
                                    onChange={setCompany}
                                    onSelect={handleSelectSuggestion}
                                    suggestions={suggestions}
                                />

                                <button 
                                    onClick={handleSearch}
                                    className="w-full mt-4 bg-brand-cyan text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-brand-cyan/30 transform transition hover:-translate-y-0.5 active:scale-95 focus:outline-none text-[15px]"
                                >
                                    Tiếp tục
                                </button>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="flex flex-col h-full animate-fade-in py-2 relative z-10">
                        <div className="liquid-glass p-6 rounded-2xl">
                            <button onClick={() => setStep(1)} className="text-brand-light mb-4 flex items-center space-x-2 text-sm hover:text-brand-primary font-medium transition-colors">
                                <i className="fas fa-arrow-left"></i> <span>Quay lại tìm kiếm</span>
                            </button>

                            <div className="bg-white/50 p-4 rounded-xl mb-6 border border-white shadow-sm">
                                <h3 className="text-lg font-bold text-brand-text">{name}</h3>
                                <p className="text-brand-primary text-sm font-medium">{company}</p>
                                
                                <div className="mt-3 inline-block">
                                    {(foundGuest && foundGuest.registered) ? (
                                        <span className="bg-green-100 text-green-700 text-[11px] font-bold px-2.5 py-1 rounded-md border border-green-200">
                                            <i className="fas fa-check-circle mr-1"></i> Có đăng ký trước
                                        </span>
                                    ) : (
                                        <span className="bg-orange-100 text-orange-700 text-[11px] font-bold px-2.5 py-1 rounded-md border border-orange-200">
                                            <i className="fas fa-exclamation-triangle mr-1"></i> Khách ngoài danh sách
                                        </span>
                                    )}
                                </div>
                            </div>

                            {(foundGuest && foundGuest.registered) ? (
                                <div className="mb-2">
                                    <div className="p-4 bg-blue-50/80 border border-blue-100 rounded-xl">
                                        <p className="text-sm text-slate-600 mb-3 font-medium leading-relaxed">
                                            Khách có đăng ký trước. <strong className="text-brand-primary">Bắt buộc phải nhận quà</strong> trước khi ra về.
                                        </p>
                                        <label className="flex items-center space-x-3 cursor-pointer">
                                            <div className="relative">
                                                <input 
                                                    type="checkbox" 
                                                    className="sr-only" 
                                                    checked={giftReceived} 
                                                    onChange={(e) => setGiftReceived(e.target.checked)} 
                                                />
                                                <div className={`w-11 h-6 rounded-full transition-colors ${giftReceived ? 'bg-brand-primary' : 'bg-slate-300'}`}></div>
                                                <div className={`absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform shadow-sm ${giftReceived ? 'translate-x-5' : ''}`}></div>
                                            </div>
                                            <span className="text-sm font-bold text-brand-text">Xác nhận đã trao quà</span>
                                        </label>
                                    </div>
                                    <button 
                                        onClick={handleConfirmCheckOut}
                                        disabled={!giftReceived}
                                        className={`w-full mt-6 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all text-[15px] ${giftReceived ? 'bg-brand-primary shadow-brand-primary/30 active:scale-95 hover:-translate-y-0.5' : 'bg-slate-300 cursor-not-allowed text-slate-500 shadow-none'}`}
                                    >
                                        Xác nhận Check Out
                                    </button>
                                </div>
                            ) : (
                                <div className="mb-2">
                                    <p className="text-sm text-slate-500 mb-5 text-center font-medium px-2">
                                        Khách ngoài danh sách không yêu cầu bước nhận quà. Bạn có thể check-out ngay.
                                    </p>
                                    <button 
                                        onClick={handleConfirmCheckOut}
                                        className="w-full mt-2 bg-gradient-to-r from-orange-400 to-orange-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-orange-500/30 transform transition hover:-translate-y-0.5 active:scale-95 text-[15px]"
                                    >
                                        Hoàn tất Check Out
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="h-screen flex flex-col max-w-md mx-auto relative bg-[#F3F6F9] overflow-hidden">
                    {/* Decorative Background Blobs for Liquid Effect */}
                    <div className="bg-blob bg-blue-300 w-64 h-64 top-[-10%] left-[-20%]"></div>
                    <div className="bg-blob bg-cyan-200 w-72 h-72 top-[30%] right-[-30%]"></div>
                    <div className="bg-blob bg-indigo-200 w-80 h-80 bottom-[-10%] left-[10%]"></div>

                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    
                    {/* Header */}
                    <header className="px-4 py-4 relative z-20">
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-xl bg-brand-primary flex items-center justify-center text-white font-black text-xl shadow-lg shadow-brand-primary/30">
                                    A
                                </div>
                                <div>
                                    <h1 className="text-base font-extrabold tracking-tight text-brand-text leading-tight">ASEL & Crestron</h1>
                                    <p className="text-[10px] text-brand-primary font-bold uppercase tracking-widest">Event Portal</p>
                                </div>
                            </div>
                            <button onClick={exportToCSV} className="text-brand-primary hover:text-white hover:bg-brand-primary transition-all p-2 bg-white rounded-xl w-10 h-10 flex items-center justify-center shadow-sm border border-gray-100">
                                <i className="fas fa-file-excel"></i>
                            </button>
                        </div>

                        {/* Top Large Navigation Tabs */}
                        <div className="liquid-glass p-1.5 rounded-2xl flex space-x-1 shadow-sm">
                            <button 
                                onClick={() => setActiveTab('list')} 
                                className={`flex-1 py-2.5 text-[13px] font-bold rounded-xl transition-all flex flex-col items-center justify-center ${activeTab === 'list' ? 'bg-white text-brand-text shadow-sm' : 'text-slate-500 hover:text-brand-text'}`}
                            >
                                <i className="fas fa-list-ul mb-1"></i>
                                <span>Danh sách</span>
                            </button>
                            <button 
                                onClick={() => setActiveTab('checkin')} 
                                className={`flex-1 py-2.5 text-[13px] font-bold rounded-xl transition-all flex flex-col items-center justify-center ${activeTab === 'checkin' ? 'bg-brand-primary text-white shadow-sm' : 'text-slate-500 hover:text-brand-primary'}`}
                            >
                                <i className="fas fa-sign-in-alt mb-1"></i>
                                <span>Check In</span>
                            </button>
                            <button 
                                onClick={() => setActiveTab('checkout')} 
                                className={`flex-1 py-2.5 text-[13px] font-bold rounded-xl transition-all flex flex-col items-center justify-center ${activeTab === 'checkout' ? 'bg-brand-cyan text-white shadow-sm' : 'text-slate-500 hover:text-brand-cyan'}`}
                            >
                                <i className="fas fa-sign-out-alt mb-1"></i>
                                <span>Check Out</span>
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 overflow-y-auto px-4 relative z-10 pb-6">
                        {activeTab === 'list' && renderList()}
                        {activeTab === 'checkin' && renderCheckIn()}
                        {activeTab === 'checkout' && renderCheckOut()}
                    </main>
                    
                    {/* Add safe area padding for iPhone X and newer */}
                    <div style={{ paddingBottom: 'env(safe-area-inset-bottom)' }} className="relative z-10 bg-transparent"></div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
